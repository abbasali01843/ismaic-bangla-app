name: CI

on:
  push:
    branches: ["arena/01a0844c-ismaic-bangla-app"]
  pull_request:

# Least privilege by default; jobs that publish request more below.
permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'TEMP ci diagnosis')
    runs-on: ubuntu-latest
    permissions:
      contents: write # TEMPORARY for failure diagnosis; reverted before milestone end
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set up Gradle (pinned by wrapper properties)
        run: |
          VER=$(grep -oP 'gradle-\K[0-9.]+(?=-bin)' gradle/wrapper/gradle-wrapper.properties)
          curl -sL "https://services.gradle.org/distributions/gradle-${VER}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-${VER}/bin" >> $GITHUB_PATH

      - name: Generate wrapper files
        run: gradle wrapper --stacktrace

      - name: Verify wrapper runs
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Dependency insight (TEMPORARY)
        run: |
          ./gradlew :app:dependencyInsight --dependency kotlin-stdlib --configuration debugRuntimeClasspath 2>&1 | tee insight.txt || true
          ./gradlew :app:dependencyInsight --dependency kotlinx-coroutines-core --configuration debugRuntimeClasspath 2>&1 | tee -a insight.txt || true

      - name: Lint
        run: |
          ./gradlew lintDebug --stacktrace 2>&1 | tee lint-output.txt
          exit ${PIPESTATUS[0]}

      - name: Unit tests
        run: |
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee test-output.txt
          exit ${PIPESTATUS[0]}

      - name: Build debug + release APKs
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build-output.txt
          exit ${PIPESTATUS[0]}

      - name: Capture diagnosis on failure (TEMPORARY)
        if: failure()
        run: |
          rm -f ci-diag.txt
          for f in insight.txt lint-output.txt test-output.txt build-output.txt; do
            if [ -f "$f" ]; then
              echo "===== $f =====" >> ci-diag.txt
              grep -aiE "^e: |error:|FAILED|What went wrong|Execution failed|Caused by|KaptExecution|kapt.*exception" "$f" | head -80 >> ci-diag.txt || true
              if [ "$f" = "insight.txt" ]; then
            cat "$f" >> ci-diag.txt || true
          else
            echo "--- tail of $f ---" >> ci-diag.txt
            tail -30 "$f" >> ci-diag.txt || true
          fi
            fi
          done
          echo "===== lint reports dir =====" >> ci-diag.txt
          ls app/build/reports/ >> ci-diag.txt 2>&1 || true
          for r in app/build/reports/lint-results-debug.txt; do
            if [ -f "$r" ]; then
              echo "===== $r (errors only) =====" >> ci-diag.txt
              grep -a -B2 -A6 "Error:" "$r" | head -120 >> ci-diag.txt || true
            fi
          done
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add -f ci-diag.txt
          git commit -m "TEMP ci diagnosis" || true
          git push origin HEAD:arena/01a0844c-ismaic-bangla-app || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

  release:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk/

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "সর্বশেষ APK (Latest)"
          body: "অটো-বিল্ড debug APK — ফোনে ডাউনলোড করে ইনস্টল করুন।"
          files: apk/app-debug.apk

  # One-time bootstrap: the wrapper jar is a binary that cannot be written by
  # hand, so CI generates it from the committed properties and stores it back.
  # After the first success this job exits early on every later run.
  wrapper-backfill:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if wrapper jar is already committed
        id: check
        run: |
          if git cat-file -e HEAD:gradle/wrapper/gradle-wrapper.jar; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Gradle (pinned by wrapper properties)
        if: steps.check.outputs.present == 'false'
        run: |
          VER=$(grep -oP 'gradle-\K[0-9.]+(?=-bin)' gradle/wrapper/gradle-wrapper.properties)
          curl -sL "https://services.gradle.org/distributions/gradle-${VER}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-${VER}/bin" >> $GITHUB_PATH

      - name: Generate wrapper and commit jar
        if: steps.check.outputs.present == 'false'
        run: |
          gradle wrapper --stacktrace
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add -f gradle/wrapper/gradle-wrapper.jar gradlew gradlew.bat
          git commit -m "Add Gradle wrapper jar (CI backfill)"
          git push origin HEAD:arena/01a0844c-ismaic-bangla-app
