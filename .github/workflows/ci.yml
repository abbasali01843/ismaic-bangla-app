name: CI

on:
  push:
    branches: ["arena/01a0844c-ismaic-bangla-app"]
  pull_request:

# Least privilege by default; jobs that publish request more below.
# TEMP-DIAG: contents:write so the diagnostics step can push ci-diag.txt back.
permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set up Gradle (pinned by wrapper properties)
        run: |
          VER=$(grep -oP 'gradle-\K[0-9.]+(?=-bin)' gradle/wrapper/gradle-wrapper.properties)
          curl -sL "https://services.gradle.org/distributions/gradle-${VER}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-${VER}/bin" >> $GITHUB_PATH

      - name: Generate wrapper files
        run: gradle wrapper --stacktrace

      - name: Verify wrapper runs
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      # TEMP-DIAG: tee output so failures can be pushed back as ci-diag.txt.
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee unit-tests.log

      # TEMP-DIAG: runs even on failure; pushes ci-diag.txt back [skip ci].
      - name: Collect diagnostics
        if: always()
        run: |
          {
            echo "=== TEST XML SUMMARY ==="
            ls app/build/test-results/testDebugUnitTest/ 2>/dev/null || echo "(no test-results dir)"
            for f in app/build/test-results/testDebugUnitTest/*.xml; do
              [ -f "$f" ] || continue
              echo "--- $f"
              python3 - "$f" <<'PYEOF'
              import sys, xml.etree.ElementTree as ET
              try:
                r = ET.parse(sys.argv[1]).getroot()
                print("tests=%s failures=%s errors=%s skipped=%s" % (r.get("tests"), r.get("failures"), r.get("errors"), r.get("skipped")))
                for tc in r.iter("testcase"):
                  for res in list(tc):
                    if res.tag in ("failure", "error"):
                      print("FAILED: %s :: %s" % (tc.get("classname"), tc.get("name")))
                      print("MESSAGE: %s" % ((res.get("message") or "")[:1500]))
                      print("TRACE: %s" % ((res.text or "")[:2500]))
              except Exception as e:
                print("parse error: %s" % e)
              PYEOF
            done
            echo "=== GRADLE TAIL (last 120 lines) ==="
            tail -120 unit-tests.log 2>/dev/null || echo "(no unit-tests.log)"
          } > ci-diag.txt 2>&1
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add -f ci-diag.txt
          git commit -m "TEMP: unit test diagnostics [skip ci]" || true
          git push origin HEAD:arena/01a0844c-ismaic-bangla-app || echo "push-back failed"

      - name: Build debug + release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

  release:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk/

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "সর্বশেষ APK (Latest)"
          body: "অটো-বিল্ড debug APK — ফোনে ডাউনলোড করে ইনস্টল করুন।"
          files: apk/app-debug.apk

  # One-time bootstrap: the wrapper jar is a binary that cannot be written by
  # hand, so CI generates it from the committed properties and stores it back.
  # After the first success this job exits early on every later run.
  wrapper-backfill:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if wrapper jar is already committed
        id: check
        run: |
          if git cat-file -e HEAD:gradle/wrapper/gradle-wrapper.jar; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Gradle (pinned by wrapper properties)
        if: steps.check.outputs.present == 'false'
        run: |
          VER=$(grep -oP 'gradle-\K[0-9.]+(?=-bin)' gradle/wrapper/gradle-wrapper.properties)
          curl -sL "https://services.gradle.org/distributions/gradle-${VER}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-${VER}/bin" >> $GITHUB_PATH

      - name: Generate wrapper and commit jar
        if: steps.check.outputs.present == 'false'
        run: |
          gradle wrapper --stacktrace
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add -f gradle/wrapper/gradle-wrapper.jar gradlew gradlew.bat
          git commit -m "Add Gradle wrapper jar (CI backfill)"
          git push origin HEAD:arena/01a0844c-ismaic-bangla-app
