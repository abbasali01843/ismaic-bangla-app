name: CI

on:
  push:
    branches: ["arena/01a0844c-ismaic-bangla-app"]
    tags: ["v*"]
  pull_request:

# Least privilege by default; jobs that publish request more below.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "tag=$TAG versionName=$VER"
          test "$TAG" = "$VER" || { echo "Tag v$TAG does not match versionName $VER"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set up Gradle (pinned by wrapper properties)
        run: |
          VER=$(grep -oP 'gradle-\K[0-9.]+(?=-bin)' gradle/wrapper/gradle-wrapper.properties)
          curl -sL "https://services.gradle.org/distributions/gradle-${VER}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-${VER}/bin" >> $GITHUB_PATH

      - name: Generate wrapper files
        run: gradle wrapper --stacktrace

      - name: Verify wrapper runs
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug + release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

  # Versioned releases: pushing a tag vX.Y.Z publishes a NEW GitHub Release
  # (old releases are never overwritten). See README "Releases".
  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk/

      - name: Rename APK with version
        run: mv apk/app-debug.apk "apk/islamic-bangla-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: "ফোনে ইনস্টল: নিচের APK ডাউনলোড করে ইনস্টল করুন (Play Store লাগবে না)। আগের সব সংস্করণ Releases পেজে সংরক্ষিত থাকে।"
          generate_release_notes: true
          files: apk/islamic-bangla-*.apk

  # One-time bootstrap: the wrapper jar is a binary that cannot be written by
  # hand, so CI generates it from the committed properties and stores it back.
  # After the first success this job exits early on every later run.
  wrapper-backfill:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if wrapper jar is already committed
        id: check
        run: |
          if git cat-file -e HEAD:gradle/wrapper/gradle-wrapper.jar; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Gradle (pinned by wrapper properties)
        if: steps.check.outputs.present == 'false'
        run: |
          VER=$(grep -oP 'gradle-\K[0-9.]+(?=-bin)' gradle/wrapper/gradle-wrapper.properties)
          curl -sL "https://services.gradle.org/distributions/gradle-${VER}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-${VER}/bin" >> $GITHUB_PATH

      - name: Generate wrapper and commit jar
        if: steps.check.outputs.present == 'false'
        run: |
          gradle wrapper --stacktrace
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add -f gradle/wrapper/gradle-wrapper.jar gradlew gradlew.bat
          git commit -m "Add Gradle wrapper jar (CI backfill)"
          git push origin HEAD:arena/01a0844c-ismaic-bangla-app
